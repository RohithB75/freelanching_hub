{% extends "admin_base.html" %}

{% block content %}

<style>
    .container {
        width: 450px;
        margin: 60px auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
    }

    .title {
        text-align: center;
        color: #2c6bed;
        margin-bottom: 20px;
    }

    .container input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    .container input:focus {
        border-color: #2c6bed;
        outline: none;
    }

    .container button {
        width: 100%;
        padding: 12px;
        background: #2c6bed;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    .container button:hover {
        background: #1a4ed8;
    }

    .file-label {
        margin-top: 10px;
        font-weight: bold;
    }

</style>

<div class="container">

    <h2 class="title">Post Resource</h2>

    <form method="POST" enctype="multipart/form-data">

        <input type="text" name="title" placeholder="Enter Resource Title" required>

        <input type="text" name="skills" placeholder="Skills (comma separated)" required>

        <label class="file-label">Upload Video / File</label>
        <input type="file" name="file" required>

        <button type="submit">Save Resource</button>

    </form>

</div>

{% endblock %}
