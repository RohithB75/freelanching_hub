{% extends "employer_base.html" %}

{% block content %}

<style>
    .container {
        width: 60%;
        margin: 30px auto;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }

    .btn {
        padding: 8px 12px;
        background: #2c6bed;
        color: white;
        border: none;
        border-radius: 5px;
        text-decoration: none;
    }

    .lowest {
        border: 2px solid green;
    }
</style>

<div class="container">

    <h2 style="text-align:center; color:#2c6bed;">All Bids</h2>

    {% if bids %}

        {% for bid in bids %}
        <div class="card {% if bid.amount == lowest_bid %}lowest{% endif %}">

            <p><b>Employee:</b> {{ bid.name }}</p>
            <p><b>Email:</b> {{ bid.email }}</p>
            <p><b>Bid Amount:</b> ₹{{ bid.amount }}</p>

            <!-- ✅ ASSIGN BUTTON -->
            <a href="{{ url_for('main.assign_task', project_id=bid.project_id, employee_id=bid.employee_id, amount=bid.amount) }}"
               class="btn">
                Assign Task
            </a>

        </div>
        {% endfor %}

    {% else %}
        <p style="text-align:center;">No bids yet</p>
    {% endif %}

</div>

{% endblock %}
