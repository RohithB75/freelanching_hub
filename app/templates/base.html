<!DOCTYPE html>
<html>
<head>
    <title>FreelanceHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navbar {
            background: #2c6bed;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">FreelanceHub</div>

        <div class="nav-links">
            <a href="{{ url_for('main.login') }}">Login</a>
            <a href="{{ url_for('main.signup') }}">Signup</a>
        </div>
    </div>

    {% block content %}{% endblock %}

</body>
</html>
