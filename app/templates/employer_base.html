<!DOCTYPE html>
<html>
<head>
    <title>Employer Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .navbar {
            background: #2c6bed;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">

    <span style="font-weight:bold;">FreelanceHub</span>

    <div style="float:right;">
        <a href="{{ url_for('main.profile') }}">Profile</a>
        <a href="{{ url_for('main.post_project') }}">Post Project</a>
        <a href="{{ url_for('main.view_my_projects') }}">View Posts</a>
        <a href="{{ url_for('main.assigned_tasks') }}">View Assigned Tasks</a>
        <a href="{{ url_for('main.logout') }}">Logout</a>
    </div>

</div>

<!-- PAGE CONTENT -->
<div style="padding:20px;">
    {% block content %}{% endblock %}
</div>

</body>
</html>
